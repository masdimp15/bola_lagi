<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Penalti Juz 30 - Modal Bacaan</title>



<style>

  @font-face {
  font-family: 'UthmanicNeo';
  src: url('Uthmanic_NeoCOLOR-Regular copy.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

.container{
  width:100%;
  max-width:460px;
  background:#111827;
  border-radius:22px;
  padding:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

h1{
  text-align:center;
  margin-bottom:10px;
}

.status{
  display:flex;
  justify-content:space-between;
  color:#cbd5e1;
  font-size:14px;
  margin-bottom:12px;
}

canvas{
  width:100%;
  height:auto;
  background:#15803d;
  border-radius:18px;
  display:block;
  touch-action:none;
}

.info{
  text-align:center;
  color:#cbd5e1;
  font-size:13px;
  margin-top:10px;
}

#kick{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:14px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

#kick:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.message{
  text-align:center;
  margin-top:12px;
  font-weight:bold;
  min-height:24px;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.hidden{
  display:none;
}

.modal-card{
  width:92%;
  max-width:420px;
  background:#111827;
  border-radius:24px;
  padding:24px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
  animation:pop .25s ease;
}

@keyframes pop{
  from{
    transform:scale(.9);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.modal-title{
  font-size:28px;
  margin-bottom:10px;
}

.modal-sub{
  color:#cbd5e1;
  margin-bottom:18px;
}

.arabic{
  font-family:"Amiri", serif;
  font-size:40px;
  line-height:2;
  direction:rtl;
  margin:10px 0 20px;
}

.modal-actions{
  display:flex;
  gap:12px;
}

.modal-actions button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:14px;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.ok{
  background:#16a34a;
  color:white;
}

.retry{
  background:#ea580c;
  color:white;
}

.note{
  margin-top:14px;
  color:#94a3b8;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

  <h1>⚽ Penalti Juz 30</h1>

  <div class="status">
    <div>Level <span id="level">1</span>/30</div>
    <div>Skor <span id="score">0</span></div>
  </div>

  <canvas id="game" width="420" height="560"></canvas>

  <div class="info">
    Geser bola ke arah yang diinginkan, lalu tekan <b>TENDANG</b>.
  </div>

  <button id="kick">TENDANG!</button>

  <div id="message" class="message"></div>

</div>

<!-- ================= MODAL BACAAN ================= -->

<div id="readingModal" class="modal hidden">

  <div class="modal-card">

    <div class="modal-title">⚽ GOOOL!</div>

    <div class="modal-sub">
      Baca ayat berikut dengan tartil
    </div>

    <div id="modalVerse" class="arabic"></div>

    <div class="modal-actions">
      <button id="modalCorrect" class="ok">
        Benar (+10)
      </button>

      <button id="modalRetry" class="retry">
        Ulangi
      </button>
    </div>

    <div class="note">
      Permainan terkunci sampai guru memilih salah satu tombol.
    </div>

  </div>

</div>

<script>
/* ================= DATA AYAT ================= */

const verses = [
"عَمَّ يَتَسَاءَلُونَ",
"عَنِ النَّبَإِ الْعَظِيمِ",
"وَالنَّازِعَاتِ غَرْقًا",
"عَبَسَ وَتَوَلَّى",
"إِذَا الشَّمْسُ كُوِّرَتْ",
"إِذَا السَّمَاءُ انْفَطَرَتْ",
"وَيْلٌ لِلْمُطَفِّفِينَ",
"إِذَا السَّمَاءُ انْشَقَّتْ",
"وَالسَّمَاءِ ذَاتِ الْبُرُوجِ",
"وَالسَّمَاءِ وَالطَّارِقِ",
"سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى",
"هَلْ أَتَاكَ حَدِيثُ الْغَاشِيَةِ",
"وَالْفَجْرِ",
"لَا أُقْسِمُ بِهَذَا الْبَلَدِ",
"وَالشَّمْسِ وَضُحَاهَا",
"وَاللَّيْلِ إِذَا يَغْشَى",
"وَالضُّحَى",
"أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ",
"وَالتِّينِ وَالزَّيْتُونِ",
"اقْرَأْ بِاسْمِ رَبِّكَ",
"إِنَّا أَنْزَلْنَاهُ",
"لَمْ يَكُنِ الَّذِينَ كَفَرُوا",
"إِذَا زُلْزِلَتِ الْأَرْضُ",
"وَالْعَادِيَاتِ ضَبْحًا",
"الْقَارِعَةُ",
"أَلْهَاكُمُ التَّكَاثُرُ",
"وَالْعَصْرِ",
"إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ",
"قُلْ هُوَ اللَّهُ أَحَدٌ",
"قُلْ أَعُوذُ بِرَبِّ النَّاسِ"
];

let versePool = [...verses];

function nextVerse(){
  if(versePool.length===0){
    versePool = [...verses];
  }
  const i = Math.floor(Math.random()*versePool.length);
  return versePool.splice(i,1)[0];
}

/* ================= GAME STATE ================= */

let level = 1;
let score = 0;
let gamePaused = false;
let animating = false;

/* ================= CANVAS ================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const goal = {x:70,y:40,w:280,h:100};

const ballStart = {x:210,y:470};

let ball = {
  x:ballStart.x,
  y:ballStart.y,
  r:12
};

let target = {
  x:210,
  y:90
};

let drag = false;

let keeper = {
  x:210,
  y:105,
  dir:1
};

/* ================= DRAW ================= */

function draw(){

  ctx.clearRect(0,0,420,560);

  for(let i=0;i<8;i++){
    ctx.fillStyle = i%2 ? "#15803d" : "#16a34a";
    ctx.fillRect(0,i*70,420,70);
  }

  ctx.strokeStyle = "white";
  ctx.lineWidth = 4;
  ctx.strokeRect(goal.x,goal.y,goal.w,goal.h);

  ctx.lineWidth = 1;

  for(let x=goal.x+20;x<goal.x+goal.w;x+=20){
    ctx.beginPath();
    ctx.moveTo(x,goal.y);
    ctx.lineTo(x,goal.y+goal.h);
    ctx.stroke();
  }

  for(let y=goal.y+15;y<goal.y+goal.h;y+=15){
    ctx.beginPath();
    ctx.moveTo(goal.x,y);
    ctx.lineTo(goal.x+goal.w,y);
    ctx.stroke();
  }

  ctx.strokeStyle = "rgba(255,255,255,.6)";
  ctx.beginPath();
  ctx.arc(target.x,target.y,10,0,Math.PI*2);
  ctx.stroke();

  ctx.fillStyle = "#111827";
  ctx.fillRect(keeper.x-16,keeper.y,32,50);

  ctx.beginPath();
  ctx.arc(keeper.x,keeper.y-10,11,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
  ctx.fill();
}

function idleKeeper(){

  if(gamePaused || animating) return;

  keeper.x += keeper.dir * 1.2;

  if(keeper.x<140 || keeper.x>280){
    keeper.dir *= -1;
  }
}

function loop(){

  idleKeeper();

  draw();

  requestAnimationFrame(loop);
}

loop();

/* ================= DRAG TARGET ================= */

function getPos(e){

  const r = canvas.getBoundingClientRect();

  const t = e.touches ? e.touches[0] : e;

  return {
    x:(t.clientX-r.left)*(canvas.width/r.width),
    y:(t.clientY-r.top)*(canvas.height/r.height)
  };
}

canvas.addEventListener("pointerdown",e=>{

  if(gamePaused) return;

  const p = getPos(e);

  const d = Math.hypot(p.x-ball.x,p.y-ball.y);

  if(d<26) drag = true;
});

canvas.addEventListener("pointermove",e=>{

  if(!drag || gamePaused || animating) return;

  const p = getPos(e);

  target.x = Math.max(goal.x+20,Math.min(goal.x+goal.w-20,p.x));

  target.y = Math.max(goal.y+10,Math.min(goal.y+goal.h-10,p.y));
});

window.addEventListener("pointerup",()=>drag=false);

/* ================= ANIMATE SHOT ================= */

function animateShot(){

  animating = true;

  const sx = ballStart.x;
  const sy = ballStart.y;

  const ex = target.x;
  const ey = target.y;

  const apex = 160;

  const start = performance.now();

  const keeperChoice =
    target.x<180 ? "left" :
    target.x>240 ? "right" :
    "center";

  const difficulty = Math.min(0.25 + (level-1)*0.015,0.65);

  function frame(t){

    const p = Math.min(1,(t-start)/700);

    ball.x = sx + (ex-sx)*p;

    ball.y = (1-p)*(1-p)*sy +
             2*(1-p)*p*apex +
             p*p*ey;

    if(p>0.45){

      if(keeperChoice==="left") keeper.x = 150;
      else if(keeperChoice==="right") keeper.x = 270;
      else keeper.x = 210;
    }

    if(p<1){

      requestAnimationFrame(frame);

    }else{

      const save = Math.random() < difficulty;

      if(save){

        document.getElementById("message").textContent =
          "🧤 SAVE! Kiper berhasil menepis bola.";

        resetRound();

      }else{

        document.getElementById("message").textContent =
          "⚽ GOOOL!";

        openReadingModal(nextVerse());
      }

      animating = false;
    }
  }

  requestAnimationFrame(frame);
}

function resetRound(){

  setTimeout(()=>{

    ball.x = ballStart.x;
    ball.y = ballStart.y;

    keeper.x = 210;

  },500);
}

/* ================= MODAL ================= */

const modal = document.getElementById("readingModal");

function openReadingModal(text){

  gamePaused = true;

  document.getElementById("modalVerse").textContent = text;

  modal.classList.remove("hidden");

  document.getElementById("kick").disabled = true;
}

function closeReadingModal(){

  modal.classList.add("hidden");

  gamePaused = false;

  document.getElementById("kick").disabled = false;
}

/* ================= NEXT LEVEL ================= */

function nextLevel(correct){

  if(correct){

    score += 10;

    document.getElementById("score").textContent = score;
  }

  level++;

  if(level>30){

    document.getElementById("message").textContent =
      "🏆 Selamat! Kamu menamatkan Penalti Juz 30 dengan skor "+score+"/300";

    document.getElementById("kick").disabled = true;

    return;
  }

  document.getElementById("level").textContent = level;

  ball.x = ballStart.x;
  ball.y = ballStart.y;

  keeper.x = 210;
}

/* ================= BUTTONS ================= */

document.getElementById("kick").onclick = ()=>{

  if(gamePaused || animating) return;

  animateShot();
};

document.getElementById("modalCorrect").onclick = ()=>{

  closeReadingModal();

  nextLevel(true);
};

document.getElementById("modalRetry").onclick = ()=>{

  closeReadingModal();

  nextLevel(false);
};
</script>

</body>
</html>
